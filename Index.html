<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生徒会執行部 タスク管理</title>
<style>
:root{box-sizing:border-box;--bg:#f4f5f7;--sf:#fff;--tx:#1c2333;--mu:#667085;--bd:#dfe3ea;--ac:#243a73;--lk:#0b63ce;--ok:#2e8b57;--wn:#d99a00;--er:#d2473a;--sub:#eaeef6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--sf:#1b2029;--tx:#e6e9ef;--mu:#98a1b3;--bd:#2b3240;--ac:#8fb0ff;--lk:#8ec5ff;--ok:#4cc38a;--wn:#f0b429;--er:#ff7b72;--sub:#232a38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--sf:#1b2029;--tx:#e6e9ef;--mu:#98a1b3;--bd:#2b3240;--ac:#8fb0ff;--lk:#8ec5ff;--ok:#4cc38a;--wn:#f0b429;--er:#ff7b72;--sub:#232a38;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
body.big{font-size:19px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--sf);border-bottom:1px solid var(--bd)}
h1{font-size:1.15em;margin:0}
.ctl{display:flex;gap:16px;align-items:center;font-size:.9em}
select,input[type=text],input[type=url],input[type=date],input[type=time],textarea{font:inherit;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx)}
button{font:inherit;cursor:pointer}
#perm{padding:8px 20px;font-size:.85em;color:var(--mu);background:var(--sub)}
nav{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto}
nav button{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;color:var(--mu);white-space:nowrap}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:700}
main{padding:16px 20px 40px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px 16px}
.click{cursor:pointer}.card.click:hover,.pj.click:hover{border-color:var(--ac)}
h3{margin:0 0 8px;font-size:1.05em}
.cnt{display:flex;gap:14px;color:var(--mu);font-size:.9em}.cnt b{color:var(--tx);font-size:1.25em}
.er{color:var(--er);font-weight:700;margin:6px 0 0}
.pj{margin-top:10px;font-size:.9em}small,.mu{color:var(--mu)}
.pb{height:8px;background:var(--sub);border-radius:4px;overflow:hidden;margin:3px 0}.pb i{display:block;height:100%;background:var(--ok)}
.mini{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd);font-size:.9em}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--bd)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd);font-size:.92em;white-space:nowrap}th{color:var(--mu);font-weight:600}
tr[data-task]{cursor:pointer}tr[data-dl]{cursor:grab}tr.dragging{opacity:.4}tr.dover td{box-shadow:inset 0 2px 0 currentColor}tr[data-task]:hover{background:var(--sub)}
tr.off td{color:var(--mu);opacity:.7}
.chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:.8em;background:var(--sub);color:var(--mu)}
.chip.doing{background:var(--ac);color:var(--sf)}.chip.done{background:var(--ok);color:#fff}.chip.over{background:var(--er);color:#fff}.chip.soon{background:var(--wn);color:#1c2333}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.tabs button{padding:5px 14px;border:1px solid var(--bd);border-radius:16px;background:var(--sf);color:var(--tx)}.tabs button.on{background:var(--ac);color:var(--sf);border-color:var(--ac)}
.tl{min-width:880px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 0}
.row{display:grid;grid-template-columns:210px 1fr;align-items:center;min-height:34px}
.row[data-task]{cursor:pointer}.row[data-task]:hover{background:var(--sub)}
.lb{padding:0 14px;font-size:.88em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh{padding:8px 14px 2px;font-weight:700;color:var(--ac)}
.track{position:relative;height:34px;margin-right:14px}
.tk{position:absolute;top:6px;font-size:.75em;color:var(--mu);font-style:normal;border-left:1px solid var(--bd);padding-left:3px}
.bar{position:absolute;top:9px;height:16px;border-radius:4px;background:var(--bd)}
.bar.doing{background:var(--ac)}.bar.done{background:var(--ok)}.bar.over{outline:2px solid var(--er)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--er);opacity:.7}
.bl{position:absolute;top:8px;font-size:.78em;color:var(--mu);white-space:nowrap;padding:0 6px}
.lk{position:absolute;top:17px;border-top:2px dashed var(--bd)}
.pri{padding:5px 14px;border:1px solid var(--ac);background:var(--ac);color:var(--sf);border-radius:6px;margin:0 8px 10px 0}
.fm label{display:block;margin:8px 0 2px;font-size:.88em;color:var(--mu)}.fm input[type=text],.fm input[type=date],.fm select,.fm textarea{width:100%;box-sizing:border-box}.fm .ck label{display:inline-block;margin-right:10px;color:var(--tx)}
.fm .add .sm{background:var(--sf);color:var(--tx);border-color:var(--bd);padding:3px 10px}.tm{display:flex;gap:6px}.fm .tm input,.fm .tm select{width:auto;flex:1 1 0;min-width:0}
.sm,button[data-arch-p],button[data-arch-t],button[data-rest-p],button[data-rest-t],button[data-rm],button[data-edit]{padding:3px 10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mc{background:var(--sf);border-radius:10px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px}
.mc h2{margin:0 0 4px;font-size:1.2em}.mc h4{margin:16px 0 6px}
.doc{padding:6px 0;border-top:1px solid var(--bd)}.doc:first-child{border-top:0}
.doc a{color:var(--lk);text-decoration:underline;font-weight:500;word-break:break-all}
.dl{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.dl .dd{margin-left:auto}
.dd{padding:2px 9px;border:1px solid var(--bd);background:var(--sf);color:var(--mu);border-radius:6px;font-size:.82em}.dd.arm{background:var(--er);border-color:var(--er);color:#fff}
details{background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
details details{background:var(--bg);margin:8px 0 0}
summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--tx);list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:'▶';font-size:.7em;color:var(--mu)}details[open]>summary::before{content:'▼'}
.cn{margin-left:auto;color:var(--mu);font-weight:400;font-size:.85em}
.dbody{padding:0 14px 12px}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.add input{flex:1 1 140px}
.add button.sm{padding:3px 10px;background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.add button.sm.arm{background:var(--er);border-color:var(--er);color:#fff}
.add button,.end button{padding:6px 14px;border:1px solid var(--ac);background:var(--ac);color:var(--sf);border-radius:6px}
.end{text-align:right;margin-top:16px}.end button.sec{background:none;color:var(--ac)}
.warn{color:var(--wn);font-weight:700;font-size:.9em;margin:6px 0 0}
#busy{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.18);align-items:center;justify-content:center;cursor:progress}#busy.on{display:flex}
.bp{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:24px;padding:10px 22px;box-shadow:0 4px 16px rgba(0,0,0,.25);font-weight:700;display:flex;align-items:center;gap:10px}
.sp{width:16px;height:16px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:20;max-width:90vw;background:var(--er);color:#fff;padding:8px 16px;border-radius:8px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style></head>
<body>
<header><h1>生徒会執行部 タスク管理</h1>
<div class="ctl"><span id="who"></span><label><input type="checkbox" id="big"> 会議モード</label></div></header>
<div id="perm"></div><nav id="nav"></nav><main id="app"><p class="mu">読み込み中…</p></main><div id="md"></div><div id="toast"></div>
<div id="busy" role="status" aria-live="polite"><div class="bp"><i class="sp"></i>実行中…</div></div>
<script>
const $=s=>document.querySelector(s),DAY=864e5;
const n0=new Date(),TODAY=new Date(n0.getFullYear(),n0.getMonth(),n0.getDate());
const p2=n=>String(n).padStart(2,'0');
const PD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?$/.exec(s||'');if(!m)return{d:new Date(TODAY),h:false};return{d:new Date(+m[1],m[2]-1,+m[3],m[4]?+m[4]:0,m[5]?+m[5]:0),h:!!m[4]}};
const fmt=d=>`${d.getMonth()+1}/${d.getDate()}`;
const fmtT=(d,h)=>fmt(d)+(h?` ${p2(d.getHours())}:${p2(d.getMinutes())}`:'');
const span=x=>`${fmtT(x.s,x.sh)}〜${fmtT(x.e,x.eh)}`;
const iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const hhmm=d=>`${p2(d.getHours())}:${p2(d.getMinutes())}`;
const dayOf=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const AMP=String.fromCharCode(38),ESCM={'&':AMP+'amp;','<':AMP+'lt;','>':AMP+'gt;','"':AMP+'quot;',"'":AMP+'#39;'};
const esc=s=>String(s==null?'':s).split('').map(c=>ESCM[c]||c).join('');
let S=null,TEAMS=[],ARCHTEAMS=[],ARCHIDS=new Set(),USERS={},PROJ=[],TASKS=[],ARCHP=[],ARCHT=[],XPROJ=[],XTASK=[],ORD={};
let me='',view='home',team='',tlScope='all',pf='進行中',sel=null,fm=null,busy=false,tt=0,delArm='';
const OPEN=new Set();let dq='';
const ST={todo:'未着手',doing:'進行中',done:'完了'};
const tn=id=>(TEAMS.concat(ARCHTEAMS).find(t=>t[0]==id)||[0,'(不明な班)'])[1],tnl=id=>tn(id)+(ARCHIDS.has(id)?'(アーカイブ済み)':'');
const FREE='free',tl2=t=>t.team===''?'班なし':tn(t.team),tnf=id=>id===''?'班なし':tnl(id);
const U=()=>USERS[me]||{n:'',g:[],r:{}};
const isAdm=()=>(U().g||[]).some(g=>g=='会長'||g=='システム管理者'||g=='先生');
const roleIn=t=>U().r[t];
const inTeam=t=>isAdm()||!!roleIn(t),isLead=t=>isAdm()||roleIn(t)=='班長';
const canStatus=t=>isAdm()||roleIn(t.team)=='班長'||t.asg.includes(me),canArch=isLead,canArchT=t=>t.team===''?(isAdm()||t.cr==me):isLead(t.team);
const myTeams=()=>TEAMS;   // タスク・プロジェクトは全員が全班に作成・編集できる
const mem=t=>Object.entries(USERS).filter(([k,u])=>u.active&&u.r[t]);
const clean=s=>String(s||'').trim();
const names=t=>t.asg.map(a=>(USERS[a]||{n:a}).n).join('、')||'未設定';
const pOf=t=>PROJ.find(p=>p.id==t.proj);
const TH=()=>{try{return localStorage.getItem('theme')||'auto'}catch(e){return'auto'}};
function setTheme(v){const r=document.documentElement;if(v=='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',v);try{localStorage.setItem('theme',v)}catch(e){}}
setTheme(TH());

function notify(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',6000)}
function load(s){S=s;me=s.me;ORD=s.ord||{};TEAMS=s.teams.filter(t=>!t.arch).map(t=>[t.id,t.name]);ARCHTEAMS=s.teams.filter(t=>t.arch).map(t=>[t.id,t.name]);ARCHIDS=new Set(ARCHTEAMS.map(t=>t[0]));USERS={};
 s.users.forEach(u=>USERS[u.email]={n:u.name,active:u.active,g:u.g,r:u.r});
 const cv=x=>{const a=PD(x.s),b=PD(x.e);return{...x,s:a.d,sh:a.h,e:b.d,eh:b.h}};
 const P=s.projects.map(cv),T=s.tasks.map(cv);
 PROJ=P.filter(p=>!p.arch&&!ARCHIDS.has(p.t));ARCHP=P.filter(p=>p.arch&&!ARCHIDS.has(p.t));XPROJ=P.filter(p=>!p.arch&&ARCHIDS.has(p.t));
 TASKS=T.filter(t=>!t.arch&&!ARCHIDS.has(t.team));ARCHT=T.filter(t=>t.arch&&!ARCHIDS.has(t.team));XTASK=T.filter(t=>!t.arch&&ARCHIDS.has(t.team));
 if(team!=FREE&&!TEAMS.some(t=>t[0]==team))team=TEAMS[0]?TEAMS[0][0]:'';
 if(sel&&!TASKS.concat(ARCHT,XTASK).some(t=>t.id==sel))sel=null}
function call(a,p,ok,rf){if(busy){notify('処理中です。少し待ってからもう一度操作してください。');if(rf)render();return}
 busy=true;delArm='';$('#busy').classList.add('on');
 const done=()=>{busy=false;$('#busy').classList.remove('on')};
 google.script.run.withSuccessHandler(r=>{done();if(!r.ok){notify(r.error);if(rf)render();return}load(r.state);if(ok)ok(r.res);render()})
  .withFailureHandler(e=>{done();notify('通信に失敗しました: '+(e&&e.message||e));if(rf)render()}).api(a,p||{})}

const endMs=x=>x.eh?+x.e:+x.e+DAY-1;
const flag=t=>{if(t.st=='done')return'';const n=Date.now(),e=endMs(t);if(n>e)return'over';return(t.eh?(e-n)/DAY:(+t.e-+TODAY)/DAY)<=3?'soon':''};
const outside=t=>{const p=pOf(t);return !!p&&(+t.s<+p.s||endMs(t)>endMs(p))};
const chip=t=>{const f=flag(t);return `<span class="chip ${t.st}">${ST[t.st]}</span>`+(f=='over'?' <span class="chip over">期限超過</span>':f=='soon'?' <span class="chip soon">まもなく</span>':'')+(outside(t)?' <span class="chip soon">期間外</span>':'')};
const prog=p=>{const ts=TASKS.filter(t=>t.proj==p.id),n=ts.filter(t=>t.st=='done').length;return{n,total:ts.length,pct:ts.length?Math.round(n/ts.length*100):0}};
const bar=p=>{const g=prog(p);return g.total?`<div class="pb"><i style="width:${g.pct}%"></i></div><small>進捗 ${g.pct}%(完了 ${g.n} / ${g.total} タスク)</small>`:'<small>タスクなし</small>'};
const pchip=p=>`<span class="chip ${p.st=='完了'?'done':p.st=='保留'?'':'doing'}">${esc(p.st)}</span>`;

function home(){
 const th=`<div class="tabs"><span class="mu">表示:</span>${[['auto','自動'],['light','ライト'],['dark','ダーク']].map(([k,v])=>`<button data-theme="${k}" class="${TH()==k?'on':''}">${v}</button>`).join('')}</div>`;
 return th+'<div class="grid">'+TEAMS.map(([id,name])=>{const ts=TASKS.filter(t=>t.team==id),c=k=>ts.filter(t=>t.st==k).length,ov=ts.filter(t=>flag(t)=='over').length;
return `<section class="card click" data-go="${esc(id)}"><h3>${esc(name)}</h3><div class="cnt"><span>未着手 <b>${c('todo')}</b></span><span>進行中 <b>${c('doing')}</b></span><span>完了 <b>${c('done')}</b></span></div>${ov?`<p class="er">期限超過 ${ov}件</p>`:''}${PROJ.filter(p=>p.t==id&&p.st=='進行中').map(p=>`<div class="pj">${esc(p.n)}${bar(p)}</div>`).join('')}</section>`}).join('')+freeCard()+'</div>'}
function freeCard(){const ts=TASKS.filter(t=>t.team===''),c=k=>ts.filter(t=>t.st==k).length,op=ts.filter(t=>!t.asg.length&&t.st!='done').length,ov=ts.filter(t=>flag(t)=='over').length;
 return `<section class="card click" data-go="free"><h3>班なしタスク</h3><div class="cnt"><span>未着手 <b>${c('todo')}</b></span><span>進行中 <b>${c('doing')}</b></span><span>完了 <b>${c('done')}</b></span></div>${op?`<p><b>取り組む人を募集中 ${op}件</b></p>`:''}${ov?`<p class="er">期限超過 ${ov}件</p>`:''}</section>`}
const ordOf=(ts,k)=>{const o=ORD[k]||[];if(!o.length)return ts;const ix=id=>{const i=o.indexOf(id);return i<0?1e9:i};return ts.slice().sort((a,b)=>ix(a.id)-ix(b.id))};
function tbl(ts,k){if(k)ts=ordOf(ts,k);return ts.length?(k&&ts.length>1?'<p class="mu" style="margin:4px 0">行をドラッグすると、自分の見やすい順番に並び替えられます(あなたの画面だけに反映されます)。</p>':'')+`<div class="wrap"><table><tr><th>タスク</th><th>プロジェクト</th><th>担当</th><th>期間</th><th>状態</th></tr>${ts.map(t=>`<tr data-task="${esc(t.id)}" ${k?`draggable="true" data-dl="${esc(k)}"`:''}><td>${esc(t.title)}</td><td>${pOf(t)?esc(pOf(t).n):'単発'}</td><td>${t.team===''&&!t.asg.length&&t.st!='done'?'<b>募集中</b>':esc(names(t))}</td><td>${span(t)}</td><td>${chip(t)}</td></tr>`).join('')}</table></div>`:'<p class="mu">該当するタスクはありません。</p>'}
const teamView=()=>{const fr=team==FREE;return `<div class="tabs">${TEAMS.map(([id,n])=>`<button data-team="${esc(id)}" class="${id==team?'on':''}">${esc(n)}</button>`).join('')}<button data-team="free" class="${fr?'on':''}">班なし</button></div>${addBtn('task',team)}${fr?'':addBtn('proj',team)}`+(fr?'<p class="mu">どの班にも属さない単発のタスクです。誰でも追加でき、「取り組む」を押した人が担当者になります(担当は1人だけ)。</p>':'')+tbl(TASKS.filter(t=>fr?t.team==='':t.team==team).sort((a,b)=>a.e-b.e),fr?'free':'team:'+team)+archBox(ARCHT.filter(t=>fr?t.team==='':t.team==team).sort((a,b)=>a.e-b.e),fr?'free':'team:'+team)};
function pjView(){let h=`<div class="tabs">${['進行中','完了','保留'].map(x=>`<button data-pf="${x}" class="${x==pf?'on':''}">${x}</button>`).join('')}</div>${addBtn('proj')}`;
 return h+'<div class="grid">'+TEAMS.map(([id,name])=>{const ps=PROJ.filter(p=>p.t==id&&p.st==pf);return `<section class="card"><h3>${esc(name)}</h3>${ps.length?ps.map(p=>`<div class="pj click" data-pj="${esc(p.id)}"><b>${esc(p.n)}</b> <small>${span(p)}</small>${bar(p)}</div>`).join(''):'<p class="mu">該当するプロジェクトはありません。</p>'}</section>`}).join('')+'</div>'}

/* ---- 資料 ---- */
let df={scope:'',team:'',proj:'',task:'',n:'',u:''};
const DSC={all:'執行部全体',team:'班全体',project:'プロジェクト',task:'タスク'},DKEY={team:'team',project:'proj',task:'task'};
const ALLP=()=>PROJ.concat(XPROJ),ALLT=()=>TASKS.concat(XTASK);
const docsOf=(sc,tg)=>S.docs.filter(d=>d.scope==sc&&d.target==tg);
const dkey=d=>d.scope+'|'+d.target+'|'+d.u;
const dlink=d=>`<a href="${esc(d.u)}" target="_blank" rel="noopener">${esc(d.n)}</a>`;
const dline=(d,extra)=>`<div class="doc"><div class="dl">${dlink(d)} <small>${esc(d.by)}・${esc(d.at)}</small><button class="dd ${delArm==dkey(d)?'arm':''}" data-dds="${esc(d.scope)}" data-ddt="${esc(d.target)}" data-ddu="${esc(d.u)}">${delArm==dkey(d)?'もう一度押すと削除':'削除'}</button></div>${extra||''}</div>`;
const dlist=ds=>ds.length?ds.map(d=>dline(d)).join(''):'<p class="mu">まだ資料がありません。</p>';
const tclick=t=>ARCHIDS.has(t.team)?`<small class="mu">${esc(t.title)}</small>`:`<small class="click" data-task="${esc(t.id)}" style="text-decoration:underline">${esc(t.title)}</small>`;
const tdocs=ts=>ts.flatMap(t=>t.docs.map(d=>dline(d,tclick(t)))).join('');
const dcnt=ts=>ts.reduce((n,t)=>n+t.docs.length,0);
const dsec=(k,title,n,inner)=>`<details data-k="${esc(k)}" ${OPEN.has(k)?'open':''}><summary>${title}<span class="cn">${n}件</span></summary><div class="dbody">${inner}</div></details>`;
const archBox=(ts,k)=>ts.length?`<div style="margin-top:16px">${dsec('archbox:'+k,'アーカイブ済みのタスク',ts.length,tbl(ts))}</div>`:'';
function docForm(){

 const ap=ARCHP.filter(p=>canArch(p.t)),at=ARCHT.filter(t=>canArchT(t)&&!t.via);
 h+=`<section class="card"><h3>アーカイブ</h3>${ap.length+at.length+(isAdm()?ARCHTEAMS.length:0)?(isAdm()?ARCHTEAMS.map(([i,n])=>`<div class="mini"><span>班: ${esc(n)}</span><button data-rest-team="${esc(i)}">元に戻す</button></div>`).join(''):'')+ap.map(p=>`<div class="mini"><span>プロジェクト: ${esc(p.n)} <small>(${esc(tn(p.t))})</small></span><button data-rest-p="${esc(p.id)}">元に戻す</button></div>`).join('')+at.map(t=>`<div class="mini"><span>タスク: ${esc(t.title)} <small>(${esc(tl2(t))})</small></span><button data-rest-t="${esc(t.id)}">元に戻す</button></div>`).join(''):'<p class="mu">アーカイブしたプロジェクトとタスクはありません。</p>'}</section>`;
 return h}
